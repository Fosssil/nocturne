### INPUT FIELD ###
input-field {
    monitor =
	position = 0, -120
    size = 250, 60
    outline_thickness = 2

	dots_size = 0.20         # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.20      # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true

	# inner_color = rgba(17, 17, 27, 0.55)
	# outer_color = rgba(180, 190, 254, 0.85)
	check_color = rgba(166, 227, 161, 0.90)
	fail_color = rgba(243, 139, 168, 0.90)

	outer_color = rgba(cdd6f400)
	inner_color = rgba(11111bcc)
	font_color = rgb(cdd6f4)

    font_color = $text
	font_family = $font
    fade_on_empty = true
    hide_input = false
	placeholder_text = <i><span foreground="##cdd6f4">Password...</span></i>
	fail_text = <i><span foreground="#f38ba8">Authentication failed</span></i>
    halign = center
	rounding = 6
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
	# color = rgba(205, 214, 244, 0.72)
	color = rgba(cdd6f499)
    font_size = 120
    font_family =  $font_bold
    position = 0, -300
    halign = center
    valign = top
}

# Greeting
label {
    monitor =
    text = Hi there, $USER
	# color = rgba(205, 214, 244, 0.62)
	color = rgba(cdd6f499)
    font_size = 25
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}
