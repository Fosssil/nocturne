# Variables
$font = Maple Mono NF
$font_bold = Maple Mono NF Bold

# colors
$base = rgb(1e1e2e)
$surface0 = rgb(313244)
$surface1 = rgb(45475a)
$text = rgb(cdd6f4)
$subtext = rgb(a6adc8)

$blue = rgb(89b4fa)
$lavender = rgb(b4befe)
$overlay = rgba(17, 17, 27, 0.55)
 --------------------------------------------------

# General
general {
	hide_cursor = false
    no_fade_in = false
	no_fade_out = false
    grace = 0
    disable_loading_bar = false
}

# Background
background {
	monitor =
	path = ~/Pictures/wall/wallhaven-we2y6r_1920x1080.png
    blur_passes = 2
	blur_size = 7
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

