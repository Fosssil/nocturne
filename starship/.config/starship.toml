# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

add_newline = true
continuation_prompt = "[∙](text) "

format = """
$username\
$directory\
$git_branch\
$git_metrics\
$git_status\
$sudo\
$character\
"""


right_format = ""

[character]
success_symbol = "[➜](bold mauve)"
# success_symbol = "[~>](bold mauve)"
error_symbol = "[](red)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "blue"
read_only = " "
# read_only = " 󰌾"
home_symbol = "~"
read_only_style = "bold yellow"
truncate_to_repo = false
truncation_length = 9
fish_style_pwd_dir_length = 0
repo_root_style = "underline blue"

[git_branch]
format = '[$symbol$branch]($style) '
style = "bold green"
symbol = " "
ignore_branches = ["main", "master"]

# ~/.config/starship.toml

[git_metrics]
added_style = 'bold blue'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '
disabled = true

[git_status]
format = '([$up_to_date$staged$deleted$ahead_behind$untracked$modified$diverged]($style) )'
style = "lavender"
up_to_date = "[✓](bold green)"
staged = "[+${count}](green)"
deleted = "[✘${count}](maroon)"
ahead = "[⇡${count}](sapphire)"
behind = "[⇣${count}](green)"
untracked = "[?${count}](yellow)"
modified = "[!${count}](peach)"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# ~/.config/starship.toml

[sudo]
format = "[$symbol]($style)"
style = 'bold yellow'
symbol = " "
disabled = false

